name: Build & deploy H2A site
on:
  # Every gate below ran ONLY after merge until 2026-08-07, so a pull request could not be
  # validated before it landed. That is how the S1.P3 merge broke `main`: the port was correct,
  # a test fixture in scripts/ still signed DER, and nothing checked the PR. The gates were
  # already good; they were simply pointed at the wrong moment.
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # Per-ref, not a single global `pages` group — otherwise two open pull requests cancel each
  # other's checks and whichever loses the race reports no result at all.
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # full history so the site can show per-page "last updated" dates
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install (Python)
        run: pip install -r requirements.txt -r reference/requirements.txt
      # All four TypeScript components, not just the issuer. Until 2026-08-07 CI installed and
      # typechecked one of the four, so the verifier — the component whose whole job is to be
      # trustworthy — was never compiled here at all.
      - name: Install (TypeScript components)
        run: |
          for c in verifier issuer-service subject-signer witness-service; do
            npm --prefix "reference/$c" ci
          done
      - name: Validate schemas + examples (gate)
        run: python scripts/validate-schemas.py
      - name: Verify reference implementation (gate)
        run: python scripts/check-reference.py

      # --- ADR-014 -----------------------------------------------------------
      # These two are what stop the canonicalisation split reopening. check-jcs proves every
      # implementation agrees with the normative vectors and that the duplicated jcs.ts copies are
      # byte-identical; check-crosslang proves a signature written in one language verifies in the
      # other, and that DER is refused. The second is not implied by the first: before ADR-014 every
      # component had a green selftest, because each signed and verified with its own canonicaliser.
      - name: ADR-014 conformance — vectors + copy identity (gate)
        run: python scripts/check-jcs.py
      - name: ADR-014 cross-language — either language verifies the other (gate)
        run: python scripts/check-crosslang.py
      # S1.X1. The three checks above all read THIS repository's copy of the vectors, so they
      # prove the four implementations agree with a file this repository controls. bridle and
      # hdicr vendor their own copies and run the same shape of check against those. Nothing
      # compared the copies, so all three could drift apart while every suite stayed green —
      # the same closed-loop failure as the canonicalisers themselves, one level up.
      #
      # Here the pin is checked against the source of truth, which sounds circular and is not:
      # it asserts that interop/vectors/vectors.json has not been edited away from the digest
      # that bridle and hdicr are pinned to. Change the vectors here without updating the pin
      # in all three repositories and this repository goes red first.
      - name: ADR-014 vector pin — the copies in all three repos are one file (gate)
        run: node scripts/check-vectors-pinned.mjs interop/vectors/vectors.json
      - name: Verifier selftest (gate)
        run: npm --prefix reference/verifier run selftest

      - name: Typecheck TypeScript components (gate)
        run: |
          for c in verifier issuer-service subject-signer witness-service; do
            echo "--- $c"
            npm --prefix "reference/$c" run typecheck
          done
      - name: Cross-language interop — TS signs, Python verifies (gate)
        run: |
          npm --prefix reference/issuer-service run emit-interop -- "$RUNNER_TEMP/interop"
          python scripts/check-interop.py "$RUNNER_TEMP/interop"
      - name: Build site
        run: python site/build.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/_out }
  deploy:
    needs: build
    # Pull requests run every gate but publish nothing — a proposed change must not be able to
    # replace the live site before it is merged.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
